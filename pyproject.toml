[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blakelabs-multimedia"
version = "0.4.0"
description = "Professional native cross-platform multimedia conversion powered by FFmpeg."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Blake Labs" }]
dependencies = ["PySide6==6.9.3"]

[project.scripts]
blakelabs-multimedia = "blakelabs_multimedia.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pillow>=11.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]
build = [
  "imageio>=2.37",
  "nuitka==4.1.3",
  "ordered-set>=4.1",
  "pillow>=11.0",
  "zstandard>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blakelabs_multimedia"]

[tool.hatch.build.targets.wheel.force-include]
"src/blakelabs_multimedia/presentation/qml" = "blakelabs_multimedia/presentation/qml"
"src/blakelabs_multimedia/resources" = "blakelabs_multimedia/resources"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/installer",
  "/README.md",
  "/CONTRIBUTING.md",
  "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["blakelabs_multimedia"]

[tool.coverage.report]
show_missing = true
skip_covered = true
