name: Native builds and releases

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  plan:
    name: Plan native distribution
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Resolve version and release state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi

          build=true
          publish=false

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              build=false
            else
              publish=true
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows-installer:
    name: Windows x64 packages
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - shell: pwsh
        run: ./scripts/build_msix.ps1 -SkipStandalone
      - name: Load real music with the packaged Windows executable
        timeout-minutes: 2
        shell: pwsh
        run: |
          $env:SMOKE_MEDIA = Join-Path $env:RUNNER_TEMP "blakelabs-smoke.wav"
          $env:BLAKELABS_SMOKE_MEDIA = $env:SMOKE_MEDIA
          $env:BLAKELABS_SCREENSHOT_PATH = Join-Path $env:RUNNER_TEMP "blakelabs-windows-ui.png"
          $env:BLAKELABS_SCREENSHOT_DELAY_MS = "2200"
          $env:BLAKELABS_SMOKE_EXIT_MS = "3800"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"

          Remove-Item -LiteralPath $env:BLAKELABS_SCREENSHOT_PATH -Force -ErrorAction SilentlyContinue

          @'
          import math
          import os
          import struct
          import wave

          sample_rate = 44_100
          with wave.open(os.environ["SMOKE_MEDIA"], "wb") as audio:
              audio.setnchannels(1)
              audio.setsampwidth(2)
              audio.setframerate(sample_rate)
              frames = (
                  struct.pack("<h", round(7_000 * math.sin(2 * math.pi * 440 * index / sample_rate)))
                  for index in range(sample_rate)
              )
              audio.writeframes(b"".join(frames))
          '@ | python -

          $application = Start-Process `
            -FilePath ".\build\windows\BlakeLabsMultimedia\BlakeLabsMultimedia.exe" `
            -PassThru

          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          $screenshotReady = $false

          do {
            if (Test-Path -LiteralPath $env:BLAKELABS_SCREENSHOT_PATH) {
              $screenshot = Get-Item -LiteralPath $env:BLAKELABS_SCREENSHOT_PATH
              if ($screenshot.Length -gt 1024) {
                $header = [byte[]]::new(8)
                $stream = [System.IO.File]::Open(
                  $env:BLAKELABS_SCREENSHOT_PATH,
                  [System.IO.FileMode]::Open,
                  [System.IO.FileAccess]::Read,
                  [System.IO.FileShare]::ReadWrite
                )
                try {
                  $bytesRead = $stream.Read($header, 0, $header.Length)
                }
                finally {
                  $stream.Dispose()
                }

                if (
                  $bytesRead -eq 8 -and
                  [Convert]::ToHexString($header) -eq "89504E470D0A1A0A"
                ) {
                  $screenshotReady = $true
                  break
                }
              }
            }

            $application.Refresh()
            if ($application.HasExited) {
              break
            }

            Start-Sleep -Milliseconds 250
          } while ([DateTime]::UtcNow -lt $deadline)

          if (-not $screenshotReady) {
            if (-not $application.HasExited) {
              Stop-Process -Id $application.Id -Force
              $application.WaitForExit()
            }
            throw "Packaged application did not produce a valid UI smoke screenshot within 30 seconds"
          }

          if (-not $application.WaitForExit(20000)) {
            Stop-Process -Id $application.Id -Force
            $application.WaitForExit()
            throw "Packaged application produced the screenshot but did not exit cleanly"
          }

          if ($application.ExitCode -ne 0) {
            throw "Packaged application exited with code $($application.ExitCode)"
          }
      - name: Upload packaged Windows UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: UI-smoke-Windows
          path: ${{ runner.temp }}/blakelabs-windows-ui.png
          if-no-files-found: error
      - shell: pwsh
        run: choco install innosetup --yes --no-progress
      - shell: pwsh
        run: iscc installer/windows/blakelabs-multimedia.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BlakeLabsMultimedia-Windows-x64
          path: |
            build/installer/BlakeLabsMultimedia-Setup-x64.exe
            build/msix/BlakeLabsMultimedia-Store-x64.msix
          if-no-files-found: error

  linux-bundle:
    name: Linux x64 bundle
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bash scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BlakeLabsMultimedia-Linux-x64
          path: build/linux/BlakeLabsMultimedia-linux-x64.tar.gz
          if-no-files-found: error

  macos-bundle:
    name: macOS ${{ matrix.arch }} DMG
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bash scripts/build_macos.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: BlakeLabsMultimedia-macOS-${{ matrix.arch }}
          path: build/macos/BlakeLabsMultimedia-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish-release:
    name: Publish permanent GitHub Release
    needs: [plan, windows-installer, linux-bundle, macos-bundle]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BlakeLabsMultimedia-*
          path: release-assets
          merge-multiple: true
      - name: Flatten and verify release assets
        run: >-
          python3 scripts/prepare_release_assets.py
          --source release-assets
          --destination release-upload
      - name: Create release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BlakeLabs Multimedia $RELEASE_TAG" \
            --generate-notes
