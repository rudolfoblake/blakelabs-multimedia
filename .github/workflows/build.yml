name: Native builds and releases

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  plan:
    name: Plan native distribution
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Resolve version and release state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi

          build=true
          publish=false

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              build=false
            else
              publish=true
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows-installer:
    name: Windows x64 packages
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - shell: pwsh
        run: ./scripts/build_msix.ps1 -SkipStandalone
      - shell: pwsh
        run: choco install innosetup --yes --no-progress
      - shell: pwsh
        run: iscc installer/windows/blakelabs-multimedia.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BlakeLabsMultimedia-Windows-x64
          path: |
            build/installer/BlakeLabsMultimedia-Setup-x64.exe
            build/msix/BlakeLabsMultimedia-Store-x64.msix
          if-no-files-found: error

  linux-bundle:
    name: Linux x64 bundle
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bash scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BlakeLabsMultimedia-Linux-x64
          path: build/linux/BlakeLabsMultimedia-linux-x64.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish permanent GitHub Release
    needs: [plan, windows-installer, linux-bundle]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BlakeLabsMultimedia-*
          path: release-assets
          merge-multiple: true
      - name: Flatten and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload

          while IFS= read -r -d '' asset; do
            destination="release-upload/$(basename "$asset")"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release asset name: $(basename "$asset")" >&2
              exit 1
            fi
            cp "$asset" "$destination"
          done < <(find release-assets -type f -print0)

          expected=(
            BlakeLabsMultimedia-Setup-x64.exe
            BlakeLabsMultimedia-Store-x64.msix
            BlakeLabsMultimedia-linux-x64.tar.gz
          )

          for asset in "${expected[@]}"; do
            if [[ ! -f "release-upload/$asset" ]]; then
              echo "Missing required release asset: $asset" >&2
              find release-assets -type f -print >&2
              exit 1
            fi
          done

          asset_count="$(find release-upload -maxdepth 1 -type f | wc -l)"
          if [[ "$asset_count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} release assets, found $asset_count." >&2
            find release-upload -maxdepth 1 -type f -print >&2
            exit 1
          fi

          sha256sum release-upload/*
      - name: Create release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BlakeLabs Multimedia $RELEASE_TAG" \
            --generate-notes
