name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python 3.12 quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src scripts
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Install Qt and FFmpeg runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libegl1 libgl1
      - name: Convert a camera-style MOV to universal MP4
        env:
          SOURCE_MOV: ${{ runner.temp }}/blakelabs-camera.mov
          OUTPUT_MP4: ${{ runner.temp }}/blakelabs-camera-converted.mp4
        run: |
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=640x360:rate=30 \
            -f lavfi -i sine=frequency=880:sample_rate=48000 \
            -t 2 \
            -c:v mjpeg -q:v 3 \
            -c:a pcm_s16le \
            -metadata:s:v:0 rotate=90 \
            "$SOURCE_MOV"
          uv run python scripts/smoke_ffmpeg_conversion.py \
            --source "$SOURCE_MOV" \
            --output "$OUTPUT_MP4" \
            --preset mp4-balanced
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUTPUT_MP4")" = "h264"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$OUTPUT_MP4")" = "aac"
      - name: Create real audio smoke fixture
        env:
          SMOKE_MEDIA: ${{ runner.temp }}/blakelabs-smoke.wav
        run: |
          python3 - <<'PY'
          import math
          import os
          import struct
          import wave
          from pathlib import Path

          destination = Path(os.environ["SMOKE_MEDIA"])
          sample_rate = 44_100
          with wave.open(str(destination), "wb") as audio:
              audio.setnchannels(1)
              audio.setsampwidth(2)
              audio.setframerate(sample_rate)
              frames = (
                  struct.pack("<h", round(7_000 * math.sin(2 * math.pi * 440 * index / sample_rate)))
                  for index in range(sample_rate)
              )
              audio.writeframes(b"".join(frames))
          PY
      - name: Load real music through the complete QML application
        timeout-minutes: 1
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          BLAKELABS_SMOKE_MEDIA: ${{ runner.temp }}/blakelabs-smoke.wav
          BLAKELABS_SCREENSHOT_PATH: ${{ runner.temp }}/blakelabs-ui-smoke.png
          BLAKELABS_SCREENSHOT_DELAY_MS: "1600"
          BLAKELABS_SMOKE_EXIT_MS: "2800"
        run: uv run blakelabs-multimedia
      - name: Upload UI smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: BlakeLabsMultimedia-UI-smoke
          path: ${{ runner.temp }}/blakelabs-ui-smoke.png
          if-no-files-found: error
