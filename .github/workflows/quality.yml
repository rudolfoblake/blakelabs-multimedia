name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python 3.12 quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src scripts
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1
      - name: QML offscreen startup smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          BLAKELABS_SMOKE_EXIT_MS: "300"
        run: uv run blakelabs-multimedia
